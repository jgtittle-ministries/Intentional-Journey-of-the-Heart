name: Nightly mirror backup

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure SSH deploy key
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_DEPLOY_KEY:-}" ]; then
            echo "::error::MIRROR_DEPLOY_KEY secret is not set on this repo."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$MIRROR_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Mirror to private backup repo
        env:
          DEST_REPO: jgtittle/Intentional-Journey-of-the-Heart
        run: |
          set -euo pipefail
          git clone --mirror "https://github.com/${GITHUB_REPOSITORY}.git" repo.git
          cd repo.git
          git remote set-url --push origin "git@github.com:${DEST_REPO}.git"
          git push --mirror
          echo "Mirrored ${GITHUB_REPOSITORY} -> ${DEST_REPO} at $(date -u +%FT%TZ)"
